name: Bug report
description: Something is broken or behaving unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not file security issues here.** Email security@hmddevs.org.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the `X-Request-Id` from the response if you have one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gateway version / commit SHA
  - type: input
    id: env
    attributes:
      label: Environment (self-hosted / HMD production)
